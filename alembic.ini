# Alembic configuration.
# For CLI usage the URL is read from config.ini via alembic/env.py.
# When run inside the app the URL is passed through
# config.attributes["sqlalchemy_url"].
# Keep this file ASCII-only: Alembic reads it with the system locale encoding.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///networth.db
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
